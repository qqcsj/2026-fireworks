<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 跨年视觉盛宴</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        #fireworksCanvas, #textCanvas { position: absolute; top: 0; left: 0; }
        #fireworksCanvas { z-index: 1; } #textCanvas { z-index: 10; }
        .start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 1.5rem; color: #fff; background: linear-gradient(45deg, #d32f2f, #ff9800);
            border: none; border-radius: 40px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 87, 34, 0.8);
            animation: pulse 1.5s infinite; z-index: 100; white-space: nowrap; letter-spacing: 2px;
        }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } }
    </style>
</head>
<body>
    <button class="start-btn" id="startBtn">点击开启跨年惊喜 🎵</button>
    <canvas id="fireworksCanvas"></canvas> <canvas id="textCanvas"></canvas> <audio id="bgMusic" src="music.mp3" loop></audio>
    <script>
        const startBtn = document.getElementById('startBtn'), bgMusic = document.getElementById('bgMusic');
        
        // 核心全局变量：控制灯笼状态与生成
        let isLanternsReleased = false; 
        let stopSpawningLanterns = false; // 大结局前停止生成新灯笼

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none'; bgMusic.play(); startBackgroundEffects(); startParticleSequence();
        });

        // ==================== 1. 粒子文字系统 ====================
        const tCanvas = document.getElementById('textCanvas'), tCtx = tCanvas.getContext('2d', { willReadFrequently: true });
        let w = tCanvas.width = window.innerWidth, h = tCanvas.height = window.innerHeight;
        window.addEventListener('resize', () => { w = tCanvas.width = window.innerWidth; h = tCanvas.height = window.innerHeight; });
        let particles = [];
        class Particle {
            constructor(x, y) {
                this.x = Math.random() * w; this.y = Math.random() * h; this.tx = x; this.ty = y; 
                this.r = Math.random() * 1.5 + 1; this.color = `hsl(${Math.random() * 360}, 100%, 75%)`; 
                this.friction = Math.random() * 0.04 + 0.9; this.vx = 0; this.vy = 0;
            }
            update() {
                this.vx = (this.vx + (this.tx - this.x) * 0.02) * this.friction;
                this.vy = (this.vy + (this.ty - this.y) * 0.02) * this.friction;
                this.x += this.vx; this.y += this.vy;
            }
            draw() { tCtx.beginPath(); tCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2); tCtx.fillStyle = this.color; tCtx.fill(); }
            explode() { this.vx = (Math.random()-0.5)*80; this.vy = (Math.random()-0.5)*80; this.tx = this.x+(Math.random()-0.5)*2000; this.ty = this.y+(Math.random()-0.5)*2000; }
        }
        function getTextCoordinates(text) {
            let offscreen = document.createElement('canvas'); offscreen.width = w; offscreen.height = h;
            let oCtx = offscreen.getContext('2d', { willReadFrequently: true });
            let lines = text.split('\n'), isMobile = w < 600;
            let fontSize = Math.min((w*0.9)/Math.max(...lines.map(l=>l.length)), (h*0.7)/lines.length);
            if (text.length <= 2) fontSize = isMobile ? (w * 0.6) : 350; 
            oCtx.font = `bold ${fontSize}px "Microsoft YaHei"`; oCtx.fillStyle = "white"; oCtx.textAlign = "center"; oCtx.textBaseline = "middle";
            lines.forEach((line, i) => oCtx.fillText(line, w/2, h/2 - (lines.length-1)*(fontSize*1.2)/2 + i*(fontSize*1.2)));
            let data = oCtx.getImageData(0,0,w,h).data, coords = [], gap = isMobile?3:5;
            for (let y=0;y<h;y+=gap) for(let x=0;x<w;x+=gap) if(data[(y*w+x)*4+3]>128) coords.push({x,y});
            return coords;
        }
        function changeText(text) {
            let coords = getTextCoordinates(text);
            if (coords.length > particles.length) for (let i=coords.length-particles.length; i>0; i--) particles.push(new Particle(w/2, h/2));
            particles.forEach((p, i) => { if(i<coords.length){p.tx=coords[i].x;p.ty=coords[i].y;}else{p.tx=Math.random()*w;p.ty=h+200;} });
        }
        function animateParticles() { tCtx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animateParticles); }

        // === 核心时间轴：智能等待引擎 ===
        function startParticleSequence() {
            animateParticles();
            const sequence = [
                { text: "3", duration: 1500 }, 
                { text: "2", duration: 1500 }, 
                { text: "1", duration: 1500 },
                { text: "2026\n新年快乐", duration: 3500 }, 
                { text: "二零二六\n新年到", duration: 3500 },
                { text: "吉星高照\n福星绕", duration: 3500 }, 
                { text: "彩色烟花\n满天飘", duration: 3500 },
                // 标记为 dynamic，意味着它将智能等待，不使用固定时间
                { text: "岁岁平安\n步步高", duration: 'dynamic' }, 
                { text: "祝大家\n新年胜旧年", duration: 999999 } 
            ];
            let step = 0;

            function nextStep() {
                if (step >= sequence.length) return;
                
                // 放飞动作
                if (step === 3) {
                    isLanternsReleased = true;
                    lanterns.forEach(l => { if(l.state === 'grounded') l.launch(); });
                }

                // 【高能监控逻辑】：如果到了“岁岁平安”，启动智能等待
                if (sequence[step].duration === 'dynamic') {
                    stopSpawningLanterns = true; // 停止生成新灯笼
                    if (step > 0) particles.forEach(p => p.explode()); // 炸掉上一句
                    
                    setTimeout(() => {
                        changeText(sequence[step].text); // 显示岁岁平安
                        step++;
                        
                        // 智能雷达：不断扫描屏幕上还有没有没缩小的灯笼
                        function waitForAllStars() {
                            // 筛选出所有还没有变成星星（gathered）的灯笼
                            let remainingLanterns = lanterns.filter(l => l.state !== 'gathered');
                            
                            if (remainingLanterns.length === 0) {
                                // 完美清空！所有灯笼都变成星星了！发射大结局烟花！
                                fireworks.push(new GiantFirework());
                                setTimeout(() => {
                                    particles.forEach(p => p.explode()); // 文字随着大烟花炸裂
                                    setTimeout(() => {
                                        changeText(sequence[step].text); // 重组为“新年胜旧年”
                                    }, 800);
                                }, 1500); // 等待大烟花飞到高空的时间
                            } else {
                                // 如果还有没变小的，稍微给它们加点速，防止等待过久，继续扫描
                                remainingLanterns.forEach(l => {
                                    l.scaleDecay = Math.max(l.scaleDecay, 0.0035); 
                                    l.vy = Math.min(l.vy, -2.5); 
                                });
                                requestAnimationFrame(waitForAllStars); // 下一帧继续检查
                            }
                        }
                        waitForAllStars(); // 启动雷达
                    }, 800);
                    return; // 退出常规循环，由雷达接管后续动作
                }

                // 常规播放逻辑
                if (step > 0) particles.forEach(p => p.explode());
                let pause = step === 0 ? 0 : (step <= 3 ? 1500 : 800);
                setTimeout(() => {
                    changeText(sequence[step].text); 
                    let dur = sequence[step].duration; 
                    step++;
                    setTimeout(nextStep, dur); // 停留 3.5 秒后进入下一步
                }, pause); 
            }
            nextStep(); 
        }

        // ==================== 2. 背景特效系统 ====================
        const fCanvas = document.getElementById('fireworksCanvas'), fCtx = fCanvas.getContext('2d');
        fCanvas.width = window.innerWidth; fCanvas.height = window.innerHeight;
        let fwParticles = [], fireworks = [], lanterns = [];

        // 常规烟花
        class Firework {
            constructor() {
                this.x=Math.random()*fCanvas.width; this.y=fCanvas.height; this.tx=Math.random()*fCanvas.width; this.ty=Math.random()*(fCanvas.height/2); 
                this.speed=Math.random()*3+4; this.angle=Math.atan2(this.ty-this.y,this.tx-this.x);
                this.vx=Math.cos(this.angle)*this.speed; this.vy=Math.sin(this.angle)*this.speed; this.color=`hsl(${Math.random()*360},100%,60%)`; this.history=[];
            }
            update(i, array) {
                this.history.push({x:this.x,y:this.y}); if(this.history.length>5)this.history.shift();
                this.x+=this.vx; this.y+=this.vy; if(this.vy>=0||this.y<=this.ty){ array.splice(i,1); this.explode(); }
            }
            draw() { fCtx.beginPath();fCtx.moveTo(this.history[0]?.x||this.x,this.history[0]?.y||this.y);fCtx.lineTo(this.x,this.y);fCtx.strokeStyle=this.color;fCtx.lineWidth=3;fCtx.stroke(); }
            explode() { for(let i=0;i<Math.random()*50+50;i++) fwParticles.push(new FwParticle(this.x,this.y,this.color)); }
        }
        
        // 超级大烟花
        class GiantFirework {
            constructor() {
                this.x = fCanvas.width / 2; this.y = fCanvas.height; 
                this.tx = fCanvas.width / 2; this.ty = fCanvas.height * 0.25; 
                this.speed = 8; this.angle = Math.atan2(this.ty - this.y, this.tx - this.x);
                this.vx = Math.cos(this.angle) * this.speed; this.vy = Math.sin(this.angle) * this.speed;
                this.color = '#ffeb3b'; this.history = [];
            }
            update(i, array) {
                this.history.push({x:this.x,y:this.y}); if(this.history.length>8)this.history.shift();
                this.x+=this.vx; this.y+=this.vy; 
                if(this.vy>=0||this.y<=this.ty){ array.splice(i,1); this.explode(); }
            }
            draw() { fCtx.beginPath();fCtx.moveTo(this.history[0]?.x||this.x,this.history[0]?.y||this.y);fCtx.lineTo(this.x,this.y);fCtx.strokeStyle=this.color;fCtx.lineWidth=6;fCtx.stroke(); }
            explode() {
                const colors = ['#ff0044', '#00ff88', '#0088ff', '#ffeb3b', '#ff00ff'];
                for(let i=0;i<350;i++) {
                    let c = colors[Math.floor(Math.random() * colors.length)];
                    fwParticles.push(new FwParticle(this.x, this.y, c, true)); 
                }
            }
        }

        class FwParticle {
            constructor(x,y,c, isGiant = false) { 
                this.x=x;this.y=y;this.color=c;
                let a=Math.random()*Math.PI*2; 
                let s = isGiant ? Math.random()*15+2 : Math.random()*5+1; 
                this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.alpha=1; 
                this.decay = isGiant ? Math.random()*0.008+0.005 : Math.random()*0.015+0.015;
            }
            update(i) { this.vx*=0.95;this.vy*=0.95;this.vy+=0.1;this.x+=this.vx;this.y+=this.vy;this.alpha-=this.decay;if(this.alpha<=0)fwParticles.splice(i,1); }
            draw() { fCtx.globalAlpha=this.alpha;fCtx.beginPath();fCtx.arc(this.x,this.y,2,0,Math.PI*2);fCtx.fillStyle=this.color;fCtx.fill();fCtx.globalAlpha=1; }
        }

        // === 强制缩放·孔明灯 ===
        class Lantern {
            constructor() {
                this.baseWidth = Math.random() * 35 + 25; this.baseHeight = this.baseWidth * 1.9; 
                this.vx = (Math.random()-0.5)*0.3; this.wobble=Math.random()*Math.PI*2; this.wobbleSpeed=Math.random()*0.02+0.01;
                this.flickerBase=Math.random()>0.5?240:210; this.flickerSpeed=Math.random()*0.1+0.05; this.flickerState=Math.random()*Math.PI*2;
                this.candleIntensity = Math.random()*0.4+0.7;
                
                const blessings = ["学业有成","事业腾飞","身体健康","岁岁平安","幸福美满","国家欣欣向荣","国泰民安","前程似锦","万事如意","快乐无忧","财源广进","心想事成","吉星高照","五福临门","家和万事兴","未来可期","平安喜乐","一夜暴富","好运爆棚","金榜题名"];
                this.text = this.baseWidth>30 ? blessings[Math.floor(Math.random()*blessings.length)] : "";

                // 底部潜伏状态
                if (!isLanternsReleased) {
                    this.state = 'grounded';
                    this.x = Math.random() * fCanvas.width;
                    // 保留底部发光的神秘感，顶部稍露边缘
                    this.y = fCanvas.height + this.baseHeight * 0.4 + Math.random() * 15;
                    this.scale = Math.random() * 0.3 + 0.9; 
                    this.vy = 0;
                } else {
                    this.state = 'rising';
                    this.x = Math.random() * fCanvas.width; this.y = fCanvas.height + 50;
                    this.scale = 1; this.launch();
                }
            }
            launch() {
                this.state = 'rising';
                this.vy = -(Math.random() * 0.6 + 0.4); 
                this.scaleDecay = Math.random() * 0.001 + 0.0005;
            }
            update(index) {
                this.wobble += this.wobbleSpeed; this.flickerState += this.flickerSpeed;
                
                if (this.state === 'grounded') {
                    this.x += this.vx + Math.sin(this.wobble)*0.1;
                    this.y = fCanvas.height + this.baseHeight*0.4 + Math.sin(this.wobble*0.7)*5;
                } else if (this.state === 'rising') {
                    this.x += (this.vx + Math.sin(this.wobble)*0.4) * this.scale;
                    this.y += this.vy * this.scale;
                    this.scale -= this.scaleDecay; // 强制变小
                    
                    let targetSkyHeight = fCanvas.height * (0.05 + Math.random() * 0.2);
                    // 无论在哪，只要缩得足够小（0.06），就强制变为星星
                    if ((this.y < targetSkyHeight && this.scale < 0.25) || this.scale <= 0.06) {
                        this.state = 'gathered'; 
                    }
                } else if (this.state === 'gathered') {
                    // 星星状态：强制继续缩小到点状
                    if (this.scale > 0.06) {
                        this.scale -= 0.001; 
                    } else {
                        this.scale = 0.06; // 锁定最终星辰尺寸
                    }
                    this.x += Math.sin(this.wobble)*0.05 * this.scale;
                    this.y += Math.cos(this.wobble*0.8)*0.05 * this.scale;
                }
            }
            draw() {
                if (this.scale <= 0.01) return;
                let fVal = this.flickerBase + Math.sin(this.flickerState)*40;
                let cRgb = `${255},${Math.min(255,fVal+10)},${Math.max(0,fVal-100)}`;
                fCtx.save(); fCtx.translate(this.x, this.y); fCtx.scale(this.scale, this.scale);
                
                let grad = fCtx.createRadialGradient(0, this.baseHeight*0.35, 0, 0, 0, this.baseHeight*0.9);
                grad.addColorStop(0, `rgba(255,255,220,${0.95*this.candleIntensity})`);
                grad.addColorStop(0.5, `rgba(${cRgb},${0.85*this.candleIntensity})`);
                grad.addColorStop(1, `rgba(${cRgb.split(',')[0]},${cRgb.split(',')[1]},60,0)`);
                fCtx.fillStyle = grad;
                fCtx.beginPath(); fCtx.moveTo(-this.baseWidth/2,-this.baseHeight*0.45);fCtx.lineTo(this.baseWidth/2,-this.baseHeight*0.45);fCtx.lineTo(this.baseWidth*0.42,this.baseHeight/2);fCtx.lineTo(-this.baseWidth*0.42,this.baseHeight/2);fCtx.closePath();fCtx.fill();

                if (this.text && this.scale > 0.35 && this.state === 'rising') {
                    let fs = Math.min(this.baseWidth*0.38, (this.baseHeight*0.8)/this.text.length);
                    fCtx.font = `bold ${fs}px "KaiTi","STKaiti","Microsoft YaHei"`; fCtx.fillStyle = "rgba(20,10,0,0.85)"; fCtx.textAlign="center"; fCtx.textBaseline="middle";
                    for(let i=0;i<this.text.length;i++) fCtx.fillText(this.text[i], 0, -((this.text.length-1)*fs*1.1)/2 + i*fs*1.1);
                }
                
                fCtx.beginPath(); fCtx.ellipse(0, this.baseHeight/2, this.baseWidth*0.42, this.baseWidth*0.12, 0, 0, Math.PI*2);
                fCtx.fillStyle = `rgba(${cRgb},0.95)`; fCtx.shadowBlur=30;fCtx.shadowColor='rgba(255,180,50,0.9)';fCtx.fill();fCtx.restore();
            }
        }

        function startBackgroundEffects() {
            for(let i=0;i<100;i++) lanterns.push(new Lantern());
            function loop() {
                fCtx.fillStyle = 'rgba(0,0,0,0.2)'; fCtx.fillRect(0,0,fCanvas.width,fCanvas.height);
                
                if(Math.random()<0.05) fireworks.push(new Firework());
                
                // 大结局前不断补货，大结局到了就彻底停止生成新灯笼
                if(isLanternsReleased && !stopSpawningLanterns && Math.random()<0.08 && lanterns.length<250) {
                    lanterns.push(new Lantern());
                }
                
                fireworks.forEach((f,i)=>f.update(i, fireworks)); fireworks.forEach(f=>f.draw());
                fwParticles.forEach((p,i)=>p.update(i)); fwParticles.forEach(p=>p.draw());
                lanterns.forEach((l,i)=>l.update(i)); lanterns.forEach(l=>l.draw());
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
