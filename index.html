<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 跨年快乐</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* 纯黑背景更能衬托烟花 */
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        /* 烟花背景画布 */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* 粒子文字画布 */
        #textCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        /* 播放按钮 */
        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 1.5rem;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #ff7f00);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            animation: pulse 1.5s infinite;
            z-index: 100;
            white-space: nowrap;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <button class="start-btn" id="startBtn">点击开启 2026 视觉盛宴 🎵</button>

    <canvas id="fireworksCanvas"></canvas>
    <canvas id="textCanvas"></canvas>

    <audio id="bgMusic" src="music.mp3" loop></audio>

    <script>
        // ==========================================
        // 核心流程控制
        // ==========================================
        const startBtn = document.getElementById('startBtn');
        const bgMusic = document.getElementById('bgMusic');
        
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none'; // 隐藏按钮
            bgMusic.play(); // 播放音乐
            startFireworks(); // 开启背景烟花
            startParticleSequence(); // 开启粒子文字剧本
        });

        // ==========================================
        // 1. 粒子文字聚合与爆炸系统
        // ==========================================
        const tCanvas = document.getElementById('textCanvas');
        const tCtx = tCanvas.getContext('2d', { willReadFrequently: true });
        let w = tCanvas.width = window.innerWidth;
        let h = tCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = tCanvas.width = window.innerWidth;
            h = tCanvas.height = window.innerHeight;
        });

        let particles = [];
        
        // 粒子类：负责小球的运动和绘制
        class Particle {
            constructor(x, y) {
                // 初始位置在屏幕外随机产生
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.tx = x; // 目标X
                this.ty = y; // 目标Y
                this.r = Math.random() * 2 + 1.5; // 小球大小
                this.color = `hsl(${Math.random() * 360}, 100%, 75%)`; // 随机彩色
                this.friction = Math.random() * 0.04 + 0.92; // 摩擦力
                this.vx = 0;
                this.vy = 0;
            }
            update() {
                // 弹簧物理效果逼近目标点
                let dx = this.tx - this.x;
                let dy = this.ty - this.y;
                this.vx += dx * 0.02;
                this.vy += dy * 0.02;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                tCtx.beginPath();
                tCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                tCtx.fillStyle = this.color;
                tCtx.fill();
            }
            // 爆炸散开
            explode() {
                this.vx = (Math.random() - 0.5) * 60; // 瞬间大速度
                this.vy = (Math.random() - 0.5) * 60;
                // 散开后目标暂时设为屏幕外或边缘
                this.tx = this.x + (Math.random() - 0.5) * 1000; 
                this.ty = this.y + (Math.random() - 0.5) * 1000;
            }
        }

        // 获取文字的像素坐标
        function getTextCoordinates(text) {
            let offscreen = document.createElement('canvas');
            offscreen.width = w; offscreen.height = h;
            let oCtx = offscreen.getContext('2d', { willReadFrequently: true });
            
            let lines = text.split('\n');
            let isMobile = w < 600;
            // 动态字体大小
            let fontSize = lines.length > 2 ? (isMobile ? 25 : 50) : (isMobile ? 60 : 150);
            if(text.length === 1) fontSize = isMobile ? 150 : 300; // 倒计时字体放大
            
            oCtx.font = `bold ${fontSize}px "Microsoft YaHei"`;
            oCtx.fillStyle = "white";
            oCtx.textAlign = "center";
            oCtx.textBaseline = "middle";
            
            let startY = h / 2 - (lines.length - 1) * (fontSize * 1.2) / 2;
            lines.forEach((line, i) => {
                oCtx.fillText(line, w / 2, startY + i * (fontSize * 1.2));
            });

            let imageData = oCtx.getImageData(0, 0, w, h).data;
            let coordinates = [];
            // 采样间隔（决定小球的密集程度，数值越小越密）
            let gap = isMobile ? 4 : 6; 

            for (let y = 0; y < h; y += gap) {
                for (let x = 0; x < w; x += gap) {
                    let index = (y * w + x) * 4;
                    let alpha = imageData[index + 3];
                    if (alpha > 128) {
                        coordinates.push({ x: x, y: y });
                    }
                }
            }
            return coordinates;
        }

        // 切换到新文字
        function changeText(text) {
            let coords = getTextCoordinates(text);
            
            // 如果现在的粒子不够，就增加新粒子
            if (coords.length > particles.length) {
                let diff = coords.length - particles.length;
                for (let i = 0; i < diff; i++) {
                    particles.push(new Particle(w/2, h/2));
                }
            }
            
            // 重新分配目标点
            for (let i = 0; i < particles.length; i++) {
                if (i < coords.length) {
                    particles[i].tx = coords[i].x;
                    particles[i].ty = coords[i].y;
                } else {
                    // 多余的粒子散开隐藏到屏幕外
                    particles[i].tx = Math.random() * w;
                    particles[i].ty = h + 100; 
                }
            }
        }

        // 触发爆炸效果
        function explodeAll() {
            particles.forEach(p => p.explode());
        }

        // 粒子动画循环
        function animateParticles() {
            tCtx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        // 动画剧本：倒计时 -> 2026 -> 祝福语
        function startParticleSequence() {
            animateParticles(); // 启动循环
            
            const sequence = [
                { text: "3", duration: 1000 },
                { text: "2", duration: 1000 },
                { text: "1", duration: 1000 },
                { text: "2026\n新年快乐", duration: 3000 },
                { text: "二零二六新年到\n吉星高照福星绕\n彩色烟花满天飘\n岁岁平安步步高", duration: 999999 } // 最后一直显示
            ];

            let step = 0;

            function nextStep() {
                if (step >= sequence.length) return;
                
                // 如果不是第一步，先爆炸散开
                if (step > 0) {
                    explodeAll();
                }

                // 爆炸后稍等 300 毫秒再聚合成新字
                setTimeout(() => {
                    changeText(sequence[step].text);
                    let currentDuration = sequence[step].duration;
                    step++;
                    if (step < sequence.length) {
                        setTimeout(nextStep, currentDuration);
                    }
                }, step === 0 ? 0 : 400); 
            }

            nextStep(); // 开始剧本
        }

        // ==========================================
        // 2. 绚丽背景烟花系统
        // ==========================================
        const fCanvas = document.getElementById('fireworksCanvas');
        const fCtx = fCanvas.getContext('2d');
        fCanvas.width = window.innerWidth;
        fCanvas.height = window.innerHeight;

        let fwParticles = [];
        let fireworks = [];

        class Firework {
            constructor() {
                this.x = Math.random() * fCanvas.width;
                this.y = fCanvas.height;
                this.tx = Math.random() * fCanvas.width;
                this.ty = Math.random() * (fCanvas.height / 2); // 在上半屏炸开
                this.speed = Math.random() * 3 + 4;
                this.angle = Math.atan2(this.ty - this.y, this.tx - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.history = [];
            }
            update(index) {
                this.history.push({x: this.x, y: this.y});
                if(this.history.length > 5) this.history.shift();
                
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.vy >= 0 || this.y <= this.ty) {
                    fireworks.splice(index, 1);
                    this.explode();
                }
            }
            draw() {
                fCtx.beginPath();
                fCtx.moveTo(this.history[0]?.x || this.x, this.history[0]?.y || this.y);
                fCtx.lineTo(this.x, this.y);
                fCtx.strokeStyle = this.color;
                fCtx.lineWidth = 3;
                fCtx.stroke();
            }
            explode() {
                let count = Math.random() * 50 + 50;
                for (let i = 0; i < count; i++) {
                    fwParticles.push(new FwParticle(this.x, this.y, this.color));
                }
            }
        }

        class FwParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.friction = 0.95;
                this.gravity = 0.1;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update(index) {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) fwParticles.splice(index, 1);
            }
            draw() {
                fCtx.globalAlpha = this.alpha;
                fCtx.beginPath();
                fCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                fCtx.fillStyle = this.color;
                fCtx.fill();
                fCtx.globalAlpha = 1;
            }
        }

        function startFireworks() {
            function loop() {
                // 半透明黑色清屏，制造拖影效果
                fCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);

                // 随机发射新烟花
                if (Math.random() < 0.05) {
                    fireworks.push(new Firework());
                }

                fireworks.forEach((fw, i) => { fw.update(i); fw.draw(); });
                fwParticles.forEach((p, i) => { p.update(i); p.draw(); });

                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
