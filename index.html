<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 跨年视觉盛宴</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #fireworksCanvas, #textCanvas { position: absolute; top: 0; left: 0; }
        #fireworksCanvas { z-index: 1; }
        #textCanvas { z-index: 10; }
        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 1.5rem;
            color: #fff; background: linear-gradient(45deg, #d32f2f, #ff9800);
            border: none; border-radius: 40px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 87, 34, 0.8);
            animation: pulse 1.5s infinite; z-index: 100; white-space: nowrap; letter-spacing: 2px;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <button class="start-btn" id="startBtn">点击开启跨年惊喜 🎵</button>
    <canvas id="fireworksCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const bgMusic = document.getElementById('bgMusic');
        
        // 【新增】全局状态变量：孔明灯是否已经放飞
        let isLanternsReleased = false; 

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            bgMusic.play();
            startBackgroundEffects();
            startParticleSequence();
        });

        // ==================== 1. 粒子文字系统 ====================
        const tCanvas = document.getElementById('textCanvas');
        const tCtx = tCanvas.getContext('2d', { willReadFrequently: true });
        let w = tCanvas.width = window.innerWidth;
        let h = tCanvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            w = tCanvas.width = window.innerWidth;
            h = tCanvas.height = window.innerHeight;
        });
        
        let particles = [];
        class Particle {
            constructor(x, y) {
                this.x = Math.random() * w; this.y = Math.random() * h;
                this.tx = x; this.ty = y; 
                this.r = Math.random() * 1.5 + 1;
                this.color = `hsl(${Math.random() * 360}, 100%, 75%)`; 
                this.friction = Math.random() * 0.04 + 0.9; 
                this.vx = 0; this.vy = 0;
            }
            update() {
                let dx = this.tx - this.x; let dy = this.ty - this.y;
                this.vx += dx * 0.02; this.vy += dy * 0.02;
                this.vx *= this.friction; this.vy *= this.friction;
                this.x += this.vx; this.y += this.vy;
            }
            draw() { tCtx.beginPath(); tCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2); tCtx.fillStyle = this.color; tCtx.fill(); }
            explode() {
                this.vx = (Math.random() - 0.5) * 80; this.vy = (Math.random() - 0.5) * 80;
                this.tx = this.x + (Math.random() - 0.5) * 2000; this.ty = this.y + (Math.random() - 0.5) * 2000;
            }
        }
        
        function getTextCoordinates(text) {
            let offscreen = document.createElement('canvas');
            offscreen.width = w; offscreen.height = h;
            let oCtx = offscreen.getContext('2d', { willReadFrequently: true });
            let lines = text.split('\n');
            let isMobile = w < 600;
            let maxLen = Math.max(...lines.map(l => l.length));
            let maxWSize = (w * 0.9) / maxLen; let maxHSize = (h * 0.7) / lines.length; 
            let fontSize = Math.min(maxWSize, maxHSize);
            if (text.length <= 2) fontSize = isMobile ? (w * 0.6) : 350; 
            oCtx.font = `bold ${fontSize}px "Microsoft YaHei"`;
            oCtx.fillStyle = "white"; oCtx.textAlign = "center"; oCtx.textBaseline = "middle";
            let startY = h / 2 - (lines.length - 1) * (fontSize * 1.2) / 2;
            lines.forEach((line, i) => { oCtx.fillText(line, w / 2, startY + i * (fontSize * 1.2)); });
            let imageData = oCtx.getImageData(0, 0, w, h).data;
            let coordinates = []; let gap = isMobile ? 3 : 5; 
            for (let y = 0; y < h; y += gap) {
                for (let x = 0; x < w; x += gap) {
                    let index = (y * w + x) * 4;
                    if (imageData[index + 3] > 128) coordinates.push({ x: x, y: y });
                }
            }
            return coordinates;
        }
        
        function changeText(text) {
            let coords = getTextCoordinates(text);
            if (coords.length > particles.length) {
                let diff = coords.length - particles.length;
                for (let i = 0; i < diff; i++) { particles.push(new Particle(w/2, h/2)); }
            }
            for (let i = 0; i < particles.length; i++) {
                if (i < coords.length) { particles[i].tx = coords[i].x; particles[i].ty = coords[i].y; }
                else { particles[i].tx = Math.random() * w; particles[i].ty = h + 200; }
            }
        }
        
        function explodeAll() { particles.forEach(p => p.explode()); }
        
        function animateParticles() {
            tCtx.clearRect(0, 0, w, h); particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        // === 核心时间轴修改：触发放飞事件 ===
        function startParticleSequence() {
            animateParticles();
            const sequence = [
                { text: "3", duration: 1500 }, 
                { text: "2", duration: 1500 }, 
                { text: "1", duration: 1500 },
                { text: "2026\n新年快乐", duration: 4000 }, 
                { text: "二零二六\n新年到", duration: 3500 },
                { text: "吉星高照\n福星绕", duration: 3500 }, 
                { text: "彩色烟花\n满天飘", duration: 3500 },
                { text: "岁岁平安\n步步高", duration: 999999 } 
            ];
            let step = 0;
            
            function nextStep() {
                if (step >= sequence.length) return;
                
                // 【核心联动】：当显示到 "2026新年快乐" (step === 3) 时，全屏孔明灯解锁放飞！
                if (step === 3) {
                    isLanternsReleased = true;
                    lanterns.forEach(l => {
                        // 赋予每个人手中孔明灯向上的力量
                        l.vy = -(Math.random() * 1.5 + 0.8); 
                        l.scaleDecay = Math.random() * 0.0015 + 0.0008;
                    });
                }

                if (step > 0) explodeAll();
                let isCountdown = step <= 3; 
                let pauseTime = step === 0 ? 0 : (isCountdown ? 1500 : 600);
                
                setTimeout(() => {
                    changeText(sequence[step].text); 
                    let currentDuration = sequence[step].duration; 
                    step++;
                    if (step < sequence.length) setTimeout(nextStep, currentDuration);
                }, pauseTime); 
            }
            nextStep(); 
        }

        // ==================== 2. 背景特效 (烟花 + 高级孔明灯物理引擎) ====================
        const fCanvas = document.getElementById('fireworksCanvas');
        const fCtx = fCanvas.getContext('2d');
        fCanvas.width = window.innerWidth; fCanvas.height = window.innerHeight;
        let fwParticles = []; let fireworks = []; let lanterns = [];

        // 烟花类 (保持不变)
        class Firework {
            constructor() {
                this.x = Math.random() * fCanvas.width; this.y = fCanvas.height;
                this.tx = Math.random() * fCanvas.width; this.ty = Math.random() * (fCanvas.height / 2); 
                this.speed = Math.random() * 3 + 4;
                this.angle = Math.atan2(this.ty - this.y, this.tx - this.x);
                this.vx = Math.cos(this.angle) * this.speed; this.vy = Math.sin(this.angle) * this.speed;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`; this.history = [];
            }
            update(index) {
                this.history.push({x: this.x, y: this.y}); if(this.history.length > 5) this.history.shift();
                this.x += this.vx; this.y += this.vy;
                if (this.vy >= 0 || this.y <= this.ty) { fireworks.splice(index, 1); this.explode(); }
            }
            draw() {
                fCtx.beginPath(); fCtx.moveTo(this.history[0]?.x || this.x, this.history[0]?.y || this.y);
                fCtx.lineTo(this.x, this.y); fCtx.strokeStyle = this.color; fCtx.lineWidth = 3; fCtx.stroke();
            }
            explode() {
                let count = Math.random() * 50 + 50;
                for (let i = 0; i < count; i++) fwParticles.push(new FwParticle(this.x, this.y, this.color));
            }
        }
        
        class FwParticle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.friction = 0.95; this.gravity = 0.1; this.alpha = 1; this.decay = Math.random() * 0.015 + 0.015;
            }
            update(index) {
                this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; if (this.alpha <= 0) fwParticles.splice(index, 1);
            }
            draw() { fCtx.globalAlpha = this.alpha; fCtx.beginPath(); fCtx.arc(this.x, this.y, 2, 0, Math.PI * 2); fCtx.fillStyle = this.color; fCtx.fill(); fCtx.globalAlpha = 1; }
        }

        // ================= 全新：带飞行状态的智能孔明灯 =================
        class Lantern {
            constructor() {
                this.baseWidth = Math.random() * 30 + 20; 
                this.baseHeight = this.baseWidth * 1.9; 
                this.scale = Math.random() * 0.5 + 0.8; 
                
                // 【新增】天空最小极限尺寸，到达这个尺寸后就不再变小，化作星辰
                this.minScale = Math.random() * 0.05 + 0.06; 

                // 初始生成位置和速度分配
                if (!isLanternsReleased) {
                    // 放飞前：聚集在屏幕中下部，模拟人们捧在手里
                    this.x = Math.random() * fCanvas.width;
                    this.y = fCanvas.height - 50 - Math.random() * (fCanvas.height * 0.35); 
                    this.vy = 0; // 不向上飞
                    this.scaleDecay = 0; // 不变小
                } else {
                    // 放飞后：从底部正常生成并起飞
                    this.x = Math.random() * fCanvas.width;
                    this.y = fCanvas.height + 50; 
                    this.vy = -(Math.random() * 0.8 + 0.5); 
                    this.scaleDecay = Math.random() * 0.0015 + 0.0008; 
                }

                this.vx = (Math.random() - 0.5) * 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.03 + 0.01;
                this.flickerBase = Math.random() > 0.5 ? 240 : 210; 
                this.flickerSpeed = Math.random() * 0.1 + 0.05;
                this.flickerState = Math.random() * Math.PI * 2;
                this.candleIntensity = Math.random() * 0.4 + 0.7;

                if (this.baseWidth * this.scale > 35) {
                    const blessings = [
                        "学业有成", "事业腾飞", "身体健康", "岁岁平安", 
                        "幸福美满", "国家欣欣向荣", "国泰民安", "前程似锦", 
                        "万事如意", "快乐无忧", "财源广进", "心想事成",
                        "吉星高照", "五福临门", "家和万事兴", "未来可期",
                        "平安喜乐", "一夜暴富", "好运爆棚", "金榜题名"
                    ];
                    this.text = blessings[Math.floor(Math.random() * blessings.length)];
                } else { this.text = ""; }
            }
            
            update(index) {
                this.wobble += this.wobbleSpeed;
                this.x += (this.vx + Math.sin(this.wobble) * 0.4) * this.scale;
                this.flickerState += this.flickerSpeed;

                if (isLanternsReleased) {
                    // 放飞后，向上飘并变小
                    this.y += this.vy * this.scale;
                    
                    if (this.scale > this.minScale) {
                        // 还在变小
                        this.scale -= this.scaleDecay;
                    } else {
                        // 【核心】：已经到达极高空，变为繁星
                        this.scale = this.minScale;
                        this.vy *= 0.98; // 垂直速度趋近于 0（悬停效果）
                        if (this.vy > -0.05) this.vy = -0.05; // 保持极缓慢的移动，避免绝对静止死板
                        
                        // 【性能控制】：天空中超过 120 盏灯时，极高空最小的灯才有极小概率消失
                        if (lanterns.length > 120 && Math.random() < 0.002) {
                            lanterns.splice(index, 1);
                        }
                    }
                } else {
                    // 放飞前，仅仅在原地微微上下浮动（模拟人呼吸/手的晃动）
                    this.y += Math.sin(this.wobble) * 0.2;
                }
            }
            
            draw() {
                if (this.scale <= 0) return;
                
                let flickerVal = this.flickerBase + Math.sin(this.flickerState) * 40;
                let mainColorRgb = `${255}, ${Math.min(255, flickerVal + 10)}, ${Math.max(0, flickerVal - 100)}`;
                let baseColor = `rgba(${mainColorRgb}, 0.95)`;

                fCtx.save();
                fCtx.translate(this.x, this.y);
                fCtx.scale(this.scale, this.scale); 

                fCtx.beginPath();
                fCtx.moveTo(-this.baseWidth / 2, -this.baseHeight * 0.45); 
                fCtx.lineTo(this.baseWidth / 2, -this.baseHeight * 0.45);  
                fCtx.lineTo(this.baseWidth * 0.42, this.baseHeight / 2); 
                fCtx.lineTo(-this.baseWidth * 0.42, this.baseHeight / 2);
                fCtx.closePath();
                
                let lightGrad = fCtx.createRadialGradient(
                    0, this.baseHeight * 0.35, 0, 
                    0, 0, this.baseHeight * 0.9    
                );
                lightGrad.addColorStop(0, `rgba(255, 255, 220, ${0.95 * this.candleIntensity})`);
                lightGrad.addColorStop(0.5, `rgba(${mainColorRgb}, ${0.85 * this.candleIntensity})`);
                lightGrad.addColorStop(1, `rgba(${mainColorRgb.split(',')[0]}, ${mainColorRgb.split(',')[1]}, 60, ${0.6 * this.candleIntensity})`);
                
                fCtx.fillStyle = lightGrad;
                fCtx.fill();

                // 只有孔明灯还比较大（离得近）的时候才渲染文字，节省性能且符合物理常识
                if (this.text && this.scale > 0.3) {
                    let maxFontSizeByHeight = (this.baseHeight * 0.8) / this.text.length;
                    let fontSize = Math.min(this.baseWidth * 0.38, maxFontSizeByHeight);
                    fCtx.font = `bold ${fontSize}px "KaiTi", "STKaiti", "Microsoft YaHei"`; 
                    fCtx.fillStyle = "rgba(20, 10, 0, 0.85)"; 
                    fCtx.textAlign = "center"; fCtx.textBaseline = "middle";
                    let spacing = fontSize * 1.1; 
                    let startY = - ((this.text.length - 1) * spacing) / 2;
                    for (let i = 0; i < this.text.length; i++) {
                        fCtx.fillText(this.text[i], 0, startY + i * spacing);
                    }
                }

                fCtx.beginPath();
                fCtx.ellipse(0, this.baseHeight / 2, this.baseWidth * 0.42, this.baseWidth * 0.12, 0, 0, Math.PI * 2);
                fCtx.fillStyle = baseColor; 
                fCtx.shadowBlur = 25; fCtx.shadowColor = 'rgba(255, 200, 50, 0.8)'; 
                fCtx.fill();
                fCtx.shadowBlur = 0; 

                fCtx.restore();
            }
        }

        function startBackgroundEffects() {
            // 【提前入场】：在网页一打开时，预先在底部生成一批等待放飞的孔明灯
            for(let i = 0; i < 40; i++) {
                lanterns.push(new Lantern());
            }

            function loop() {
                fCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);
                
                if (Math.random() < 0.05) fireworks.push(new Firework());
                
                // 智能生成控制：根据是否放飞，控制屏幕上的灯笼数量
                if (!isLanternsReleased) {
                    // 放飞前，保持屏幕下半部有 80 盏左右的灯等待
                    if (Math.random() < 0.1 && lanterns.length < 80) lanterns.push(new Lantern());
                } else {
                    // 放飞后，不断从底部生成新的，填补升空的灯笼，维持高空繁星
                    if (Math.random() < 0.08 && lanterns.length < 150) lanterns.push(new Lantern());
                }

                fireworks.forEach((fw, i) => { fw.update(i); fw.draw(); });
                fwParticles.forEach((p, i) => { p.update(i); p.draw(); });
                lanterns.forEach((l, i) => { l.update(i); l.draw(); }); 
                
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
