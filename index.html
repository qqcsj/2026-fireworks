<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 跨年视觉盛宴</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #fireworksCanvas, #textCanvas {
            position: absolute;
            top: 0; left: 0;
        }
        #fireworksCanvas { z-index: 1; }
        #textCanvas { z-index: 10; }
        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 1.5rem;
            color: #fff;
            background: linear-gradient(45deg, #d32f2f, #ff9800);
            border: none; border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 87, 34, 0.8);
            animation: pulse 1.5s infinite;
            z-index: 100; white-space: nowrap; letter-spacing: 2px;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <button class="start-btn" id="startBtn">点击开启跨年惊喜 🎵</button>

    <canvas id="fireworksCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const bgMusic = document.getElementById('bgMusic');
        
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            bgMusic.play();
            startBackgroundEffects();
            startParticleSequence();
        });

        // ==========================================
        // 1. 高清粒子文字聚合与爆炸系统
        // ==========================================
        const tCanvas = document.getElementById('textCanvas');
        const tCtx = tCanvas.getContext('2d', { willReadFrequently: true });
        let w = tCanvas.width = window.innerWidth;
        let h = tCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = tCanvas.width = window.innerWidth;
            h = tCanvas.height = window.innerHeight;
        });

        let particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = Math.random() * w; this.y = Math.random() * h;
                this.tx = x; this.ty = y; 
                this.r = Math.random() * 1.5 + 1;
                this.color = `hsl(${Math.random() * 360}, 100%, 75%)`; 
                this.friction = Math.random() * 0.04 + 0.9; 
                this.vx = 0; this.vy = 0;
            }
            update() {
                let dx = this.tx - this.x; let dy = this.ty - this.y;
                this.vx += dx * 0.02; this.vy += dy * 0.02;
                this.vx *= this.friction; this.vy *= this.friction;
                this.x += this.vx; this.y += this.vy;
            }
            draw() {
                tCtx.beginPath(); tCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                tCtx.fillStyle = this.color; tCtx.fill();
            }
            explode() {
                this.vx = (Math.random() - 0.5) * 80; this.vy = (Math.random() - 0.5) * 80;
                this.tx = this.x + (Math.random() - 0.5) * 2000; this.ty = this.y + (Math.random() - 0.5) * 2000;
            }
        }

        function getTextCoordinates(text) {
            let offscreen = document.createElement('canvas');
            offscreen.width = w; offscreen.height = h;
            let oCtx = offscreen.getContext('2d', { willReadFrequently: true });
            
            let lines = text.split('\n');
            let isMobile = w < 600;
            let maxLen = Math.max(...lines.map(l => l.length));
            let maxWSize = (w * 0.9) / maxLen; 
            let maxHSize = (h * 0.7) / lines.length; 
            let fontSize = Math.min(maxWSize, maxHSize);
            
            if (text.length <= 2) fontSize = isMobile ? (w * 0.6) : 350; 

            oCtx.font = `bold ${fontSize}px "Microsoft YaHei"`;
            oCtx.fillStyle = "white";
            oCtx.textAlign = "center"; oCtx.textBaseline = "middle";
            
            let startY = h / 2 - (lines.length - 1) * (fontSize * 1.2) / 2;
            lines.forEach((line, i) => { oCtx.fillText(line, w / 2, startY + i * (fontSize * 1.2)); });

            let imageData = oCtx.getImageData(0, 0, w, h).data;
            let coordinates = [];
            let gap = isMobile ? 3 : 5; 

            for (let y = 0; y < h; y += gap) {
                for (let x = 0; x < w; x += gap) {
                    let index = (y * w + x) * 4;
                    if (imageData[index + 3] > 128) coordinates.push({ x: x, y: y });
                }
            }
            return coordinates;
        }

        function changeText(text) {
            let coords = getTextCoordinates(text);
            if (coords.length > particles.length) {
                let diff = coords.length - particles.length;
                for (let i = 0; i < diff; i++) { particles.push(new Particle(w/2, h/2)); }
            }
            for (let i = 0; i < particles.length; i++) {
                if (i < coords.length) {
                    particles[i].tx = coords[i].x; particles[i].ty = coords[i].y;
                } else {
                    particles[i].tx = Math.random() * w; particles[i].ty = h + 200; 
                }
            }
        }

        function explodeAll() { particles.forEach(p => p.explode()); }
        
        function animateParticles() {
            tCtx.clearRect(0, 0, w, h);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        function startParticleSequence() {
            animateParticles();
            const sequence = [
                { text: "3", duration: 1500 },
                { text: "2", duration: 1500 },
                { text: "1", duration: 1500 },
                { text: "2026\n新年快乐", duration: 4000 },
                { text: "二零二六\n新年到", duration: 3500 },
                { text: "吉星高照\n福星绕", duration: 3500 },
                { text: "彩色烟花\n满天飘", duration: 3500 },
                { text: "岁岁平安\n步步高", duration: 999999 } 
            ];
            let step = 0;
            function nextStep() {
                if (step >= sequence.length) return;
                if (step > 0) explodeAll();
                let isCountdown = step <= 3;
                let pauseTime = step === 0 ? 0 : (isCountdown ? 1500 : 600);

                setTimeout(() => {
                    changeText(sequence[step].text);
                    let currentDuration = sequence[step].duration;
                    step++;
                    if (step < sequence.length) setTimeout(nextStep, currentDuration);
                }, pauseTime); 
            }
            nextStep(); 
        }

        // ==========================================
        // 2. 背景特效 (烟花 + 3D透视毛笔字孔明灯)
        // ==========================================
        const fCanvas = document.getElementById('fireworksCanvas');
        const fCtx = fCanvas.getContext('2d');
        fCanvas.width = window.innerWidth;
        fCanvas.height = window.innerHeight;

        let fwParticles = []; let fireworks = []; let lanterns = [];

        class Firework {
            constructor() {
                this.x = Math.random() * fCanvas.width; this.y = fCanvas.height;
                this.tx = Math.random() * fCanvas.width; this.ty = Math.random() * (fCanvas.height / 2); 
                this.speed = Math.random() * 3 + 4;
                this.angle = Math.atan2(this.ty - this.y, this.tx - this.x);
                this.vx = Math.cos(this.angle) * this.speed; this.vy = Math.sin(this.angle) * this.speed;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.history = [];
            }
            update(index) {
                this.history.push({x: this.x, y: this.y});
                if(this.history.length > 5) this.history.shift();
                this.x += this.vx; this.y += this.vy;
                if (this.vy >= 0 || this.y <= this.ty) { fireworks.splice(index, 1); this.explode(); }
            }
            draw() {
                fCtx.beginPath();
                fCtx.moveTo(this.history[0]?.x || this.x, this.history[0]?.y || this.y);
                fCtx.lineTo(this.x, this.y);
                fCtx.strokeStyle = this.color; fCtx.lineWidth = 3; fCtx.stroke();
            }
            explode() {
                let count = Math.random() * 50 + 50;
                for (let i = 0; i < count; i++) fwParticles.push(new FwParticle(this.x, this.y, this.color));
            }
        }

        class FwParticle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.friction = 0.95; this.gravity = 0.1;
                this.alpha = 1; this.decay = Math.random() * 0.015 + 0.015;
            }
            update(index) {
                this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy;
                this.alpha -= this.decay; if (this.alpha <= 0) fwParticles.splice(index, 1);
            }
            draw() {
                fCtx.globalAlpha = this.alpha; fCtx.beginPath();
                fCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                fCtx.fillStyle = this.color; fCtx.fill(); fCtx.globalAlpha = 1;
            }
        }

        // 全新：3D透视孔明灯类 (包含长句毛笔字)
        class Lantern {
            constructor() {
                this.x = Math.random() * fCanvas.width;
                this.y = fCanvas.height + 100; // 从屏幕最底部还要靠下一点生成
                
                // 基础尺寸（决定了长宽比，现在更长一点，适应长文字）
                this.baseWidth = Math.random() * 30 + 20; 
                this.baseHeight = this.baseWidth * 1.9; 
                
                // 核心：3D缩放比例！初始很大（离得近），飞高了变小（离得远）
                this.scale = Math.random() * 0.6 + 0.8; // 初始比例 0.8 ~ 1.4
                // 衰减速度（控制孔明灯向远处飞走的速度）
                this.scaleDecay = Math.random() * 0.0015 + 0.0008; 
                
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -(Math.random() * 1.2 + 0.8); // 基础上升速度
                
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.03 + 0.01;
                this.flickerBase = Math.random() > 0.5 ? 255 : 200;
                this.flickerSpeed = Math.random() * 0.1 + 0.05;
                this.flickerState = Math.random() * Math.PI * 2;

                // 只有初始尺寸足够大的灯才会被写上祝福语
                if (this.baseWidth * this.scale > 38) {
                    const blessings = [
                        "学业有成", "事业腾飞", "身体健康", "岁岁平安", 
                        "幸福美满", "国家欣欣向荣", "国泰民安", "前程似锦", 
                        "万事如意", "快乐无忧", "财源广进"
                    ];
                    this.text = blessings[Math.floor(Math.random() * blessings.length)];
                } else {
                    this.text = "";
                }
            }
            update(index) {
                this.wobble += this.wobbleSpeed;
                
                // 移动时乘上缩放比例，模拟"远处的灯飞得慢"的物理错觉
                this.x += (this.vx + Math.sin(this.wobble) * 0.4) * this.scale;
                this.y += this.vy * this.scale;
                
                // 核心：每帧缩小，模拟飞向深空
                this.scale -= this.scaleDecay;
                
                this.flickerState += this.flickerSpeed;

                // 如果飞出屏幕上方，或者变得太小看不见了，就销毁它
                if (this.y < -this.baseHeight * this.scale || this.scale <= 0) {
                    lanterns.splice(index, 1);
                }
            }
            draw() {
                if (this.scale <= 0) return; // 缩小到没了就不画了

                let flickerVal = this.flickerBase + Math.sin(this.flickerState) * 55;
                let color = `rgba(255, ${flickerVal}, 0, 0.9)`;

                fCtx.save();
                fCtx.translate(this.x, this.y);
                
                // 应用 3D 缩放特效！！！
                fCtx.scale(this.scale, this.scale); 
                
                // 发光特效
                fCtx.shadowBlur = 30; fCtx.shadowColor = color;
                
                // 绘制灯体 (梯形)
                fCtx.beginPath();
                fCtx.moveTo(-this.baseWidth / 2, -this.baseHeight / 2); 
                fCtx.lineTo(this.baseWidth / 2, -this.baseHeight / 2);  
                fCtx.lineTo(this.baseWidth * 0.4, this.baseHeight / 2); 
                fCtx.lineTo(-this.baseWidth * 0.4, this.baseHeight / 2);
                fCtx.closePath();
                
                // 渐变填充，模拟透光
                let grad = fCtx.createLinearGradient(0, -this.baseHeight/2, 0, this.baseHeight/2);
                grad.addColorStop(0, 'rgba(255, 240, 200, 0.8)');
                grad.addColorStop(1, color);
                fCtx.fillStyle = grad;
                fCtx.fill();

                // === 绘制动态智能排版的黑色毛笔字 ===
                if (this.text) {
                    // 智能字号计算：如果字多，字号就自动变小，保证绝对能塞进灯笼里
                    let maxFontSizeByHeight = (this.baseHeight * 0.8) / this.text.length;
                    let fontSize = Math.min(this.baseWidth * 0.35, maxFontSizeByHeight);
                    
                    fCtx.font = `bold ${fontSize}px "KaiTi", "STKaiti", "Microsoft YaHei"`; 
                    fCtx.fillStyle = "rgba(0, 0, 0, 0.75)"; 
                    fCtx.textAlign = "center";
                    fCtx.textBaseline = "middle";
                    fCtx.shadowBlur = 0; // 字不需要发光
                    
                    // 竖排排版逻辑：计算起始Y坐标，让整段文字完美居中
                    let spacing = fontSize * 1.1; // 字间距
                    let startY = - ((this.text.length - 1) * spacing) / 2;
                    
                    // 一个字一个字地画出来
                    for (let i = 0; i < this.text.length; i++) {
                        fCtx.fillText(this.text[i], 0, startY + i * spacing);
                    }
                }

                // 底部明亮发光口
                fCtx.beginPath();
                fCtx.ellipse(0, this.baseHeight / 2, this.baseWidth * 0.4, this.baseWidth * 0.15, 0, 0, Math.PI * 2);
                fCtx.fillStyle = color;
                fCtx.shadowBlur = 15; fCtx.shadowColor = '#ffeb3b'; 
                fCtx.fill();
                
                fCtx.restore();
            }
        }

        function startBackgroundEffects() {
            function loop() {
                fCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);
                if (Math.random() < 0.05) fireworks.push(new Firework());
                
                // 稍微提高了一点灯笼的生成率，因为远处的灯会消失
                if (Math.random() < 0.06) lanterns.push(new Lantern());

                fireworks.forEach((fw, i) => { fw.update(i); fw.draw(); });
                fwParticles.forEach((p, i) => { p.update(i); p.draw(); });
                lanterns.forEach((l, i) => { l.update(i); l.draw(); }); 
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
